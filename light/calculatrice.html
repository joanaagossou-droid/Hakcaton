<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1c1c1e">
<!-- Page de camouflage : elle EST la page neutre de LIGHT (déclaration lue par l'analyseur NUKUN). -->
<meta name="page-role" content="camouflage">
<meta name="apple-mobile-web-app-title" content="Calculatrice">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Calculatrice</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/calc-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/calc-192.png">
<link rel="stylesheet" href="assets/calc.css">
<script src="assets/camouflage.js" defer></script>
<script src="assets/calc.js" defer></script>

<body>
<div id="notif" class="notif" role="status" aria-live="polite"><span class="notif-ic" id="notif-ic"></span><span><span class="notif-app" id="notif-app"></span><span class="notif-txt" id="notif-txt"></span></span></div>

<section id="calc" class="calc" aria-label="Calculatrice">
  <div class="screen" id="screen"><div class="expr" id="expr"></div><div class="result" id="result">0</div></div>
  <div class="keys" id="keys">
    <button type="button" class="fn" data-k="C">C</button><button type="button" class="fn" data-k="back" aria-label="Effacer">⌫</button><button type="button" class="fn" data-k="%">%</button><button type="button" class="op" data-k="/" aria-label="Diviser">÷</button>
    <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button><button type="button" class="op" data-k="*" aria-label="Multiplier">×</button>
    <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button><button type="button" class="op" data-k="-" aria-label="Soustraire">−</button>
    <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button><button type="button" class="op" data-k="+" aria-label="Additionner">+</button>
    <button type="button" class="zero" data-k="0">0</button><button type="button" data-k="." aria-label="Virgule">,</button><button type="button" class="op" data-k="=" aria-label="Égal">=</button>
  </div>
</section>

<section id="decoy" class="decoy" aria-label="Historique" hidden>
  <h1>Historique</h1>
  <ul id="decoy-list"></ul>
  <button type="button" id="decoy-back">Retour</button>
</section>

</body>
</html>
